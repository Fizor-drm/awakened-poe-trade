name: Sync upstream and publish Japanese build

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Merge upstream changes
        id: merge
        shell: bash
        run: |
          git remote add upstream https://github.com/SnosMe/awakened-poe-trade.git
          git fetch upstream master --tags
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit upstream/master
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Tag Japanese release
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          version=$(node -p "require('./main/package.json').version")
          tag="ja-v${version}"
          git tag "$tag"
          git push origin "$tag"
